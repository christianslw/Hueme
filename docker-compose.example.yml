services:
  hueme:
    build: .
    container_name: hueme-studio
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./config:/app/config
      # Optional: local PulseAudio/PipeWire monitor instead of Sendspin/Snapcast.
      # - /run/user/1000/pulse:/run/user/1000/pulse:ro
    environment:
      - PYTHONUNBUFFERED=1
      # - HUEME_MQTT_PASSWORD=change-me
      # Optional ML structure/beat analyzer (Dockerfile.analyzer).
      # - ANALYZER_URL=http://analyzer:8700
    command:
      - python
      - -m
      - hueme_studio
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      # Optional: MA sync + Home Assistant discovery from ./config/gateway.json.
      # - --gateway
      # - /app/config/gateway.json
      # - --sync
      # - --ha-discovery
    stop_grace_period: 10s
    # DDP/E1.31/WLED output needs LAN multicast/broadcast; uncomment and drop
    # the ports mapping above if the container must own the host network.
    # network_mode: host

  # Optional allin1 sidecar. Start with:
  #   docker compose -f docker-compose.example.yml up analyzer hueme
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.analyzer
    container_name: hueme-analyzer
    restart: unless-stopped
    ports:
      - "8700:8700"
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_HOME=/models
    volumes:
      - analyzer-models:/models
    stop_grace_period: 10s

volumes:
  analyzer-models:
