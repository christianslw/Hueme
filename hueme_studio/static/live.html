<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <title>Hueme Live</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111214'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23e8862e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<main class="live">
  <header class="live-head">
    <div class="brand">HUEME <span>LIVE</span></div>
    <div class="mono muted" id="link-status">OFFLINE</div>
  </header>

  <section class="live-now">
    <div class="eyebrow">Now Playing</div>
    <h1 id="show-name">No show</h1>
    <div id="active-clip" class="muted" style="min-height:18px"></div>
    <div id="live-time" class="live-time">00:00.000</div>
  </section>

  <section class="live-transport" aria-label="Transport">
    <button id="back" class="button" type="button">-10s</button>
    <button id="play" class="button primary" type="button">PLAY</button>
    <button id="forward" class="button" type="button">+10s</button>
  </section>

  <section aria-label="Live controls">
    <div class="live-slider">
      <label for="timeline">Timeline</label>
      <input id="timeline" class="slider" type="range" min="0" max="1" step="0.01" value="0">
      <output id="timeline-value" class="mono">00:00</output>
    </div>
    <div class="live-slider">
      <label for="master">Master</label>
      <input id="master" class="slider" type="range" min="0" max="1" step="0.01" value="1">
      <output id="master-value" class="mono">100%</output>
    </div>
  </section>

  <button id="blackout" class="blackout-pad" type="button">Hold for blackout</button>

  <footer class="live-foot">
    <label class="check-row" style="gap:10px;min-height:44px">
      <span>Auto show</span>
      <span class="toggle">
        <input id="auto" type="checkbox">
        <span></span>
      </span>
    </label>
    <div class="mono" id="clock">--:--</div>
    <a href="/studio">Studio</a>
  </footer>
</main>

<script type="module" src="/static/live.js"></script>
</body>
</html>
